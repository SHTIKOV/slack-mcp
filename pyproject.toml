[project]
name = "slack-readonly-mcp"
version = "0.1.0"
description = "Minimal read-only Slack MCP using your own browser session (xoxc token + d cookie)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
slack-readonly-mcp = "slack_readonly_mcp.server:main"
slack-readonly-whoami = "slack_readonly_mcp.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_readonly_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
